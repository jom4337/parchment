[package]
name = "parchment"
version = "1.4.0"
description = "Local Markdown reader"
edition = "2021"
rust-version = "1.80"
license = "AGPL-3.0-or-later"
authors = ["Jo <21996000+jom4337@users.noreply.github.com>"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Small binary: optimize for size, one codegen unit, link-time optimization, no symbols.
[profile.release]
opt-level = "s"
codegen-units = 1
lto = true
panic = "abort"
strip = true
