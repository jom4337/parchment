name: Build Android

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build, for example v1.3.0
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Writes dist/parchment.html, which the APK loads.
      - run: npm run build

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Write the release key
        env:
          KEYSTORE_BASE64: ${{ secrets.PARCHMENT_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret PARCHMENT_KEYSTORE_BASE64 is not set."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build the signed APK
        env:
          PARCHMENT_KEYSTORE: ${{ runner.temp }}/release.jks
          PARCHMENT_KEYSTORE_PASSWORD: ${{ secrets.PARCHMENT_KEYSTORE_PASSWORD }}
          PARCHMENT_KEY_ALIAS: parchment
        run: gradle -p android :app:assembleRelease --no-daemon

      - name: Check the signature and name the file
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=android/app/build/outputs/apk/release/app-release.apk
          "$BT/apksigner" verify --verbose --print-certs "$APK"
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p out
          cp "$APK" "out/Parchment_${VERSION}.apk"
          ls -l out

      - name: Remove the release key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v6
        with:
          name: parchment-android
          path: out/*.apk
          if-no-files-found: error
