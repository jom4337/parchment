name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Check Signed-off-by lines
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          fail=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            ae=$(git log -1 --format='%ae' "$c")
            if git log -1 --format='%(trailers:key=Signed-off-by,valueonly)' "$c" | grep -qiF "<$ae>"; then
              echo "ok: $(git log -1 --format='%h %s' "$c")"
            else
              echo "::error::$(git log -1 --format='%h %s' "$c"): no Signed-off-by line for $ae"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "Fix: git rebase --signoff $BASE, then git push --force-with-lease"
          fi
          exit $fail
